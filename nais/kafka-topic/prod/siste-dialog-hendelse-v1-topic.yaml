apiVersion: kafka.nais.io/v1
kind: Topic
metadata:
  name: siste-dialog-hendelse-v1
  namespace: dab
  labels:
    team: dab

spec:
  pool: nav-prod
  config:
    cleanupPolicy: compact
    retentionHours: -1 # for alltid
    minimumInSyncReplicas: 2
    partitions: 2
    replication: 2
  acl:
    - team: dab
      application: veilarbdialog
      access: write
    - team: dab
      application: dab-kafka-manager
      access: read
    - team: poao
      application: veilarboppfolging
      access: read
