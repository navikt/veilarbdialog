name: Deploy kafka topics to dev
on:
  push:
    paths:
      - "nais/kafka-topic/dev/endring-paa-dialog-v1-topic.yaml"
      - "nais/kafka-topic/dev/siste-dialog-hendelse-v1-topic.yaml"
  workflow_dispatch:

jobs:
  deploy-topics-dev:
    name: Deploy kafka topics to dev
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Deploy kafka topics
        uses: nais/deploy/actions/deploy@420caaa3a59af9aca910e372e5b7a85f3c7cd553
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/kafka-topic/dev/endring-paa-dialog-v1-topic.yaml
          PRINT_PAYLOAD: true
      - name: Deploy kafka topics
        uses: nais/deploy/actions/deploy@420caaa3a59af9aca910e372e5b7a85f3c7cd553
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/kafka-topic/dev/siste-dialog-hendelse-v1-topic.yaml
          PRINT_PAYLOAD: true